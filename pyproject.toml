[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scrib-dl"
version = "0.1.0"
description = "Convert rendered document pages into a PDF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright",
    "img2pdf",
]

[project.scripts]
scrib-dl = "scribd:main"

[tool.setuptools]
py-modules = ["scribd"]